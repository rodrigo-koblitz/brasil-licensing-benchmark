steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/brasil-licensing-benchmark:$COMMIT_SHA', '.']

  # 2. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/brasil-licensing-benchmark:$COMMIT_SHA']

  # 3. Deploy directly to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'brasil-licensing-benchmark'
      - '--image=southamerica-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/brasil-licensing-benchmark:$COMMIT_SHA'
      - '--region=southamerica-east1'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--min-instances=0'
      - '--max-instances=2'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/brasil-licensing-benchmark:$COMMIT_SHA'
